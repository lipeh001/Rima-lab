name: Search Jamendo Boom Bap CC BY
on:
  push:
    branches:
      - audit/jamendo-boombap-licenses
    paths:
      - 'tools/search_jamendo_boombap_ccby.js'
      - '.github/workflows/search-jamendo-boombap-ccby.yml'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar e validar licenças individuais no Jamendo
        env:
          JAMENDO_CLIENT_ID: a0ff80ec
        run: node tools/search_jamendo_boombap_ccby.js
      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        with:
          name: Jamendo-BoomBap-CCBY-Search
          path: search-output/*
          if-no-files-found: error
          retention-days: 14
