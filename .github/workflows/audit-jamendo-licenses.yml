name: Audit Jamendo Boom Bap Licenses

on:
  push:
    branches:
      - audit/jamendo-boombap-licenses
    paths:
      - 'tools/audit_jamendo_licenses.js'
      - '.github/workflows/audit-jamendo-licenses.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consultar licenças das 88 faixas no Jamendo
        env:
          JAMENDO_CLIENT_ID: a0ff80ec
        run: node tools/audit_jamendo_licenses.js
      - name: Publicar relatório completo
        uses: actions/upload-artifact@v4
        with:
          name: Jamendo-BoomBap-License-Audit
          path: audit-output/*
          if-no-files-found: error
          retention-days: 14
