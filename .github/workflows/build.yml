jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q RimaLab.zip -d proj
      - name: Localizar raiz Gradle
        shell: bash
        run: |
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/proj" \( -name settings.gradle -o -name settings.gradle.kts \) -type f | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Não encontrei settings.gradle dentro de RimaLab.zip."
            find proj -maxdepth 5 -type f | head -n 100
            exit 1
          fi
          BUILD_DIR="$(dirname "$SETTINGS_FILE")"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Projeto Gradle encontrado em: $BUILD_DIR"
      - name: Aplicar correções de interface, player e notificações
        shell: bash
        run: |
          HTML_FILE="$BUILD_DIR/app/src/main/assets/rima-lab.html"
          test -f "$HTML_FILE"
          node tools/fix_tela_treino.js "$HTML_FILE"
          python3 tools/patch_runtime.py "$BUILD_DIR"
      - name: Buscar catálogo ampliado de instrumentais reais (88 Boom bap, 77 Trap, 74 Drill)
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Tentativa $attempt de validar o catálogo completo"
            if node tools/fetch_catalog_seed.js "$BUILD_DIR/app/src/main/assets"; then exit 0; fi
            sleep 5
          done
          SEED="$BUILD_DIR/app/src/main/assets/beats/catalog-seed.json"
          if [ -f "$SEED" ] && node -e 'const j=require(process.argv[1]);for(const k of ["Boom bap","Trap","Drill"])if(!Array.isArray(j.catalogs?.[k])||j.catalogs[k].length!==({'Boom bap':88,'Trap':77,'Drill':74}[k]))process.exit(1)' "$SEED"; then
            echo "Usando catálogo embarcado previamente validado 88/77/74 (87/77/74 exibidos)."
            exit 0
          fi
          echo "::error::Não foi possível validar o catálogo ampliado 88/77/74 após 4 tentativas e não há catálogo embarcado válido."
          exit 1
      - name: Pré-carregar catálogo completo e corrigir definitivamente player e palco
        run: python3 tools/patch_catalog_v8.py "$BUILD_DIR"
      - name: Corrigir dicas, calibrador, sincronização e ícone duplicado
        run: python3 tools/patch_quality_v9.py "$BUILD_DIR"
      - name: Aplicar acabamento dourado/roxo, paisagem e calibração nativa
        run: python3 tools/patch_visual_v10.py "$BUILD_DIR"
      - name: Ajustar calibragem opcional, faixa horizontal e faixa inválida
        run: python3 tools/patch_visual_v11.py "$BUILD_DIR"
      - name: Corrigir rimas fonéticas, palco dourado e calibrador v12
        run: python3 tools/patch_visual_v12.py "$BUILD_DIR"
      - name: Restaurar pulso do beat e tipografia do palco v13
        run: python3 tools/patch_visual_v13.py "$BUILD_DIR"
      - name: Sincronizar brilho da palavra e moldura no pulso do beat v14
        run: python3 tools/patch_visual_v14.py "$BUILD_DIR"
      - name: Restaurar impacto do palco, fonte grande e calibração correta v15
        run: python3 tools/patch_visual_v15.py "$BUILD_DIR"
      - name: Corrigir espaçamento, moldura e primeira seleção de beat v16
        run: python3 tools/patch_visual_v16.py "$BUILD_DIR"
      - name: Reduzir brilho do texto e pulsar somente a moldura v17
        run: python3 tools/patch_visual_v17.py "$BUILD_DIR"
      - name: Fixar geometria do palco e animar somente a moldura v18
        run: python3 tools/patch_visual_v18.py "$BUILD_DIR"
      - name: Corrigir palco, pulso real e transição de treino v19
        run: python3 tools/patch_visual_v19.py "$BUILD_DIR"
      - name: Substituir animação CSS por pulso quadro a quadro no JavaScript v20
        run: python3 tools/patch_visual_v20.py "$BUILD_DIR"
      - name: Ajustar espaço da dica e brilho sutil da palavra no beat v21
        run: python3 tools/patch_visual_v21.py "$BUILD_DIR"
      - name: Aplicar identidade oficial no splash e retorno ao topo v22
        run: python3 tools/patch_visual_v22.py "$BUILD_DIR"
      - name: Ajustes finais de sincronização Bluetooth e catálogo 87/77/74 v23
        run: python3 tools/patch_final_v23.py "$BUILD_DIR"
      - name: 'Ajustes finais v24: dicas sob demanda, palco e player horizontal'
        run: python3 tools/patch_visual_v24.py "$BUILD_DIR"
      - name: Ajustar botão, dicas e curvatura da palavra principal v25
        run: python3 tools/patch_visual_v25.py "$BUILD_DIR"
      - name: Corrigir espaçamento, palco, player e calibração Bluetooth v26
        run: python3 tools/patch_visual_v26.py "$BUILD_DIR"
      - name: Player persistente, configurações salvas, calibração e tipografia v28
        run: python3 tools/patch_visual_v28.py "$BUILD_DIR"
      - name: Integrar favoritos, playlists, modos, navegação e layout v29
        run: python3 tools/patch_visual_v29.py "$BUILD_DIR"
      - name: Reorganizar configuração de treino e lista de modos v30
        run: python3 tools/patch_visual_v30.py "$BUILD_DIR"
      - name: Polir player, favoritos sincronizados e layout horizontal v33
        run: python3 tools/patch_visual_v33.py "$BUILD_DIR"
      - name: Corrigir favoritos, retomada do palco e layout horizontal v34
        run: python3 tools/patch_visual_v34.py "$BUILD_DIR"
      - name: Corrigir sincronização de favoritos, seletor e player horizontal v35
        run: python3 tools/patch_visual_v35.py "$BUILD_DIR"
      - name: Player sob demanda, calibração acústica pelo microfone e palco responsivo v36
        run: python3 tools/patch_visual_v36.py "$BUILD_DIR"
      - name: Eliminar ciclos de observadores e polling da interface v38
        run: python3 tools/patch_visual_v38.py "$BUILD_DIR"
      - name: Corrigir loop infinito do catálogo que trava a abertura v39
        run: python3 tools/patch_visual_v39.py "$BUILD_DIR"
      - name: Corrigir favoritos interligados e responsividade do palco v40
        run: python3 tools/patch_visual_v40.py "$BUILD_DIR"
      - name: Corrigir filas de favoritos, player horizontal e palco v41
        run: python3 tools/patch_visual_v41.py "$BUILD_DIR"
      - name: Unificar favoritos nos dois seletores e corrigir paisagem v42
        run: python3 tools/patch_visual_v42.py "$BUILD_DIR"
      - name: Reconstruir layout e interações de Favoritos nos dois seletores v43
        run: python3 tools/patch_visual_v43.py "$BUILD_DIR"
      - name: Corrigir acesso ao catálogo de Favoritos e preservar dados v44
        run: python3 tools/patch_visual_v44.py "$BUILD_DIR"
      - name: Destacar faixa selecionada e sincronizar Favoritos nos dois seletores v45
        run: python3 tools/patch_visual_v45.py "$BUILD_DIR"
      - name: Corrigir palco horizontal, Favoritos e download na lista V46
        run: python3 tools/patch_visual_v46.py "$BUILD_DIR"
      - name: Refinar Favoritos, rotação do player e sobreposição do palco V47
        run: python3 tools/patch_visual_v47.py "$BUILD_DIR"
      - name: Unificar seletores, restaurar player original e bloquear página de fundo V49
        run: python3 tools/patch_visual_v49.py "$BUILD_DIR"
      - name: Corrigir rolagem de Favoritos, layout horizontal e espaçamento do player V50
        run: python3 tools/patch_visual_v50.py "$BUILD_DIR"
      - name: Corrigir bloqueio da etapa 1 e exibição condicional do player V51
        run: python3 tools/patch_visual_v51.py "$BUILD_DIR"
      - name: Restaurar navegação, rolagem e toques na orientação horizontal V52
        run: python3 tools/patch_visual_v52.py "$BUILD_DIR"
      - name: Corrigir rolagem global em todas as telas e orientações V53
        run: python3 tools/patch_visual_v53.py "$BUILD_DIR"
      - name: Unificar lista, Favoritos e player sem alterar navegação V54
        run: python3 tools/patch_visual_v54.py "$BUILD_DIR"
      - name: Aplicar correções localizadas de interface V56 (3.3.4)
        run: python3 tools/patch_visual_v56.py "$BUILD_DIR"
      - name: Remover bloqueio de inicialização V57 (3.3.5)
        run: python3 tools/patch_visual_v57.py "$BUILD_DIR"
      - name: Corrigir seletor, Favoritos, recuperação de áudio e paisagem V58 (3.3.6)
        run: python3 tools/patch_visual_v58.py "$BUILD_DIR"
      - name: Corrigir títulos, Favoritos, coração, rolagem e lista horizontal V59 (3.3.7)
        run: python3 tools/patch_visual_v59.py "$BUILD_DIR"
      - name: Unificar coração, seleção de Favoritos e seletor horizontal V60 (3.3.8)
        run: python3 tools/patch_visual_v60.py "$BUILD_DIR"
      - name: Estabilizar primeiro toque nos Favoritos e corrigir seletor horizontal V61 (3.3.9)
        run: python3 tools/patch_visual_v61.py "$BUILD_DIR"
      - name: Corrigir corações duplicados, sincronização, mensagem e rolagem V62 (3.4.0)
        run: python3 tools/patch_visual_v62.py "$BUILD_DIR"
      - name: Corrigir seleção e cores dos Favoritos e seletor V63 (3.4.1)
        run: python3 tools/patch_visual_v63.py "$BUILD_DIR"
      - name: Validar somente as três correções V63
        shell: bash
        run: |
          node tools/teste_visual_v63.js "$BUILD_DIR"
          (cd "$BUILD_DIR" && node tools/teste_html_sintaxe.js)
      - name: Corrigir espaçamento do seletor e mensagem inicial do palco V64 (3.4.2)
        run: python3 tools/patch_visual_v64.py "$BUILD_DIR"
      - name: Validar correções pontuais V64
        shell: bash
        run: |
          node tools/teste_visual_v64.js "$BUILD_DIR"
          (cd "$BUILD_DIR" && node tools/teste_html_sintaxe.js)
      - name: Corrigir espaçamento, introdução, coração e contagem real dos Favoritos V65 (3.4.3)
        run: python3 tools/patch_visual_v65.py "$BUILD_DIR"
      - name: Validar sintaxe após V65
        shell: bash
        run: |
          (cd "$BUILD_DIR" && node tools/teste_html_sintaxe.js)
      - name: Corrigir contagem exata, mensagem de preparação e espaçamento do palco V66 (3.4.4)
        run: python3 tools/patch_visual_v66.py "$BUILD_DIR"
      - name: Validar V66
        shell: bash
        run: |
          (cd "$BUILD_DIR" && node tools/teste_html_sintaxe.js)
      - name: Corrigir mensagem de preparação e espaçamento diretamente na origem V67 (3.4.5)
        run: python3 tools/patch_visual_v67.py "$BUILD_DIR"
      - name: Validar V67
        shell: bash
        run: |
          (cd "$BUILD_DIR" && node tools/teste_html_sintaxe.js)
      - name: Exportar HTML e catálogo para revisão
        run: |
          mkdir -p "$GITHUB_WORKSPACE/review"
          cp "$BUILD_DIR/app/src/main/assets/rima-lab.html" "$GITHUB_WORKSPACE/review/rima-lab.html"
          cp "$BUILD_DIR/app/src/main/assets/beats/boom-bap-extra.json" "$GITHUB_WORKSPACE/review/boom-bap-extra.json"
          cp "$BUILD_DIR/app/src/main/assets/beats/catalog-seed.json" "$GITHUB_WORKSPACE/review/catalog-seed.json"
          cp "$BUILD_DIR/CATALOGO-2.9.0-VALIDADO.txt" "$GITHUB_WORKSPACE/review/CATALOGO-2.8.8-VALIDADO.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licenças do Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        shell: bash
        run: |
          cd "$BUILD_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/RimaLab.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RimaLab-apk
          path: out/RimaLab.apk
          if-no-files-found: error
      - name: Gerar APK release para assinatura de produção
        shell: bash
        run: |
          set -euo pipefail
          echo "Gerando variante release."
          cd "$BUILD_DIR"
          gradle assembleRelease
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unaligned*' | head -n 1)"
          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::O Gradle não gerou APK release."
            find app/build/outputs -maxdepth 5 -type f -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/out/RimaLab-release-unsigned.apk"
          test -s "$GITHUB_WORKSPACE/out/RimaLab-release-unsigned.apk"
          echo "APK release gerado."
      - name: Assinar APK release com chave de produção (V2/V3)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/rimalab-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          APK="$GITHUB_WORKSPACE/out/RimaLab-release-unsigned.apk"
          ALIGNED="$GITHUB_WORKSPACE/out/RimaLab-release-aligned.apk"
          SIGNED="$GITHUB_WORKSPACE/out/RimaLab-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED" | tee "$GITHUB_WORKSPACE/out/signature-verification.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$GITHUB_WORKSPACE/out/signature-verification.txt"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$GITHUB_WORKSPACE/out/signature-verification.txt"
          echo "APK release assinado e validado com V2/V3."
      - uses: actions/upload-artifact@v4
        with:
          name: RimaLab-release-signed
          path: |
            out/RimaLab-release.apk
            out/signature-verification.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RimaLab-release-unsigned
          path: out/RimaLab-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RimaLab-review
          path: review/*
          if-no-files-found: error

