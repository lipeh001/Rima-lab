name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'RimaLab.zip'
      - 'tools/fix_tela_treino.js'
      - 'tools/teste_tela_treino.js'
      - 'tools/patch_runtime.py'
      - 'tools/fetch_jamendo_beats.js'
      - 'tools/teste_runtime_v4.js'
      - 'tools/patch_catalog_v7.py'
      - 'tools/fetch_catalog_seed.js'
      - 'tools/patch_catalog_v8.py'
      - 'tools/teste_catalog_v8.js'
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q RimaLab.zip -d proj
      - name: Localizar raiz Gradle
        shell: bash
        run: |
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/proj" \( -name settings.gradle -o -name settings.gradle.kts \) -type f | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Não encontrei settings.gradle dentro de RimaLab.zip."
            find proj -maxdepth 5 -type f | head -n 100
            exit 1
          fi
          BUILD_DIR="$(dirname "$SETTINGS_FILE")"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Projeto Gradle encontrado em: $BUILD_DIR"
      - name: Aplicar correções de interface, player e notificações
        shell: bash
        run: |
          HTML_FILE="$BUILD_DIR/app/src/main/assets/rima-lab.html"
          test -f "$HTML_FILE"
          node tools/fix_tela_treino.js "$HTML_FILE"
          python3 tools/patch_runtime.py "$BUILD_DIR"
          python3 tools/patch_catalog_v7.py "$BUILD_DIR"
      - name: Buscar e validar 30 beats Boom bap no Jamendo
        run: node tools/fetch_jamendo_beats.js "$BUILD_DIR/app/src/main/assets"
      - name: Buscar 70 instrumentais reais por categoria (Boom bap, Trap e Drill)
        run: node tools/fetch_catalog_seed.js "$BUILD_DIR/app/src/main/assets"
      - name: Pré-carregar catálogo completo e corrigir definitivamente player e palco
        run: python3 tools/patch_catalog_v8.py "$BUILD_DIR"
      - name: Testes de regressão
        shell: bash
        run: |
          HTML_FILE="$BUILD_DIR/app/src/main/assets/rima-lab.html"
          node tools/teste_tela_treino.js "$HTML_FILE"
          node tools/teste_runtime_v4.js "$BUILD_DIR"
          node tools/teste_catalog_v8.js "$BUILD_DIR"
          (cd "$BUILD_DIR" && node tools/teste_html_sintaxe.js)
      - name: Exportar HTML e catálogo para revisão
        run: |
          mkdir -p "$GITHUB_WORKSPACE/review"
          cp "$BUILD_DIR/app/src/main/assets/rima-lab.html" "$GITHUB_WORKSPACE/review/rima-lab.html"
          cp "$BUILD_DIR/app/src/main/assets/beats/boom-bap-extra.json" "$GITHUB_WORKSPACE/review/boom-bap-extra.json"
          cp "$BUILD_DIR/app/src/main/assets/beats/catalog-seed.json" "$GITHUB_WORKSPACE/review/catalog-seed.json"
          cp "$BUILD_DIR/CATALOGO-2.8.8-VALIDADO.txt" "$GITHUB_WORKSPACE/review/CATALOGO-2.8.8-VALIDADO.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licenças do Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        shell: bash
        run: |
          cd "$BUILD_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/RimaLab.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RimaLab-apk
          path: out/RimaLab.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RimaLab-review
          path: review/*
          if-no-files-found: error
