name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'RimaLab.zip'
      - 'tools/fix_tela_treino.js'
      - 'tools/teste_tela_treino.js'
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q RimaLab.zip -d proj
      - name: Exportar HTML para revisão
        run: |
          HTML_FILE="$(find "$GITHUB_WORKSPACE/proj" -path '*/app/src/main/assets/rima-lab.html' -print -quit)"
          mkdir -p "$GITHUB_WORKSPACE/review"
          cp "$HTML_FILE" "$GITHUB_WORKSPACE/review/rima-lab.html"
      - name: Corrigir tela de treino e validar
        run: |
          HTML_FILE="$(find "$GITHUB_WORKSPACE/proj" -path '*/app/src/main/assets/rima-lab.html' -print -quit)"
          if [ -z "$HTML_FILE" ]; then
            echo "Não encontrei app/src/main/assets/rima-lab.html dentro de RimaLab.zip."
            exit 1
          fi
          node tools/fix_tela_treino.js "$HTML_FILE"
          node tools/teste_tela_treino.js "$HTML_FILE"
      - name: Localizar raiz Gradle
        run: |
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/proj" -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Não encontrei settings.gradle dentro de RimaLab.zip."
            find proj -maxdepth 5 -type f | head -n 100
            exit 1
          fi
          BUILD_DIR="$(dirname "$SETTINGS_FILE")"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Projeto Gradle encontrado em: $BUILD_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licenças do Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK
        run: |
          cd "$BUILD_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/RimaLab.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RimaLab-apk
          path: out/RimaLab.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RimaLab-review-html
          path: review/rima-lab.html
          if-no-files-found: error
